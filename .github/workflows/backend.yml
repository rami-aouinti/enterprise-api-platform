name: Backend quality

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'services/**'
      - 'docs/api/**'
      - 'docs/adr/**'
      - '.spectral.yaml'
      - '.oasdiff.yaml'
      - 'docs/development/**'
      - 'config/**'
      - 'public/**'
      - 'tests/**'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit.xml.dist'
      - 'phpstan.neon'
      - '.php-cs-fixer.dist.php'
      - 'scripts/**'
      - 'infrastructure/**'
      - 'compose.yaml'
      - '.env.example'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'services/**'
      - 'docs/api/**'
      - 'docs/adr/**'
      - '.spectral.yaml'
      - '.oasdiff.yaml'
      - 'docs/development/**'
      - 'config/**'
      - 'public/**'
      - 'tests/**'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit.xml.dist'
      - 'phpstan.neon'
      - '.php-cs-fixer.dist.php'
      - 'scripts/**'
      - 'infrastructure/**'
      - 'compose.yaml'
      - '.env.example'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHP 8.4 / Symfony 7.4
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: enterprise_api_test
          POSTGRES_USER: enterprise_api
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enterprise_api -d enterprise_api_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: ctype, iconv, pdo_pgsql
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Check code style
        run: composer cs:check

      - name: Run static analysis
        run: composer analyse

      - name: Run unit and functional tests
        env:
          APP_ENV: test
          APP_SECRET: ci-test-secret
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: enterprise_api_test
          DB_USER: enterprise_api
          DB_PASSWORD: test-password
        run: composer test

  api-governance:
    name: Spectral / oasdiff OpenAPI governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout with base history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Spectral
        run: npm install --global @stoplight/spectral-cli@6.17.1

      - name: Install pinned oasdiff
        run: |
          curl -fsSL -o "$RUNNER_TEMP/oasdiff.tar.gz" https://github.com/oasdiff/oasdiff/releases/download/v1.41.0/oasdiff_1.41.0_linux_amd64.tar.gz
          echo "96365453163118e6503eb71742643d9ee67f91aedbaadd1a1ce9c6213e3b71c7  $RUNNER_TEMP/oasdiff.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/oasdiff.tar.gz" -C "$RUNNER_TEMP" oasdiff
          sudo install -m 0755 "$RUNNER_TEMP/oasdiff" /usr/local/bin/oasdiff
          oasdiff --version

      - name: Lint changed contracts and check backward compatibility
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/check-openapi-contracts.sh "$BASE_REF"

  security-integration:
    name: Keycloak / Kong / Symfony JWT integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare isolated Docker Compose environment
        run: |
          cat > .env <<'ENV'
          APP_ENV=dev
          APP_DEBUG=0
          APP_SECRET=ci-local-secret-not-for-production
          DEFAULT_URI=http://localhost:8000
          POSTGRES_DB=enterprise_api
          POSTGRES_USER=enterprise_api
          POSTGRES_PASSWORD=ci-postgres-password
          KEYCLOAK_ADMIN_USERNAME=admin
          KEYCLOAK_ADMIN_PASSWORD=ci-keycloak-admin-password
          KEYCLOAK_MACHINE_CLIENT_SECRET=ci-machine-client-secret
          KEYCLOAK_PUBLIC_URL=http://localhost:8081
          KEYCLOAK_ISSUER=http://localhost:8081/realms/enterprise-platform
          KEYCLOAK_DISCOVERY_BASE_URI=http://keycloak:8080/realms/enterprise-platform/
          KEYCLOAK_AUDIENCE=enterprise-api
          ENV

      - name: Start PostgreSQL, Keycloak, Symfony API and Kong
        run: docker compose up -d --build

      - name: Wait for platform services
        run: |
          wait_for_url() {
            url="$1"
            label="$2"
            for attempt in $(seq 1 60); do
              if curl --fail --silent "$url" >/dev/null; then
                echo "$label is ready"
                return 0
              fi
              sleep 5
            done
            echo "$label did not become ready: $url" >&2
            docker compose ps
            docker compose logs --no-color "$label" || true
            return 1
          }

          wait_for_url http://localhost:9000/health/ready keycloak
          wait_for_url http://localhost:8000/health/ready api
          wait_for_url http://localhost:8100/status kong

      - name: Apply service database migrations
        run: docker compose exec -T api php bin/console app:database:migrate

      - name: Provision Keycloak machine clients and OAuth2 scopes
        run: bash scripts/keycloak-provision.sh

      - name: Run real JWT authentication and scope authorization tests
        run: bash scripts/keycloak-scope-smoke-test.sh

      - name: Collect Docker logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop integration environment
        if: always()
        run: docker compose down -v
