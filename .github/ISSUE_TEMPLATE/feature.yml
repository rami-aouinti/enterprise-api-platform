name: Fonctionnalité
description: Proposer une capacité visible par l'utilisateur ou une évolution architecturale
title: "[FEATURE] "
labels: []
body:
  - type: textarea
    id: outcome
    attributes:
      label: Problème et résultat attendu
      description: Qui en a besoin et qu'est-ce qui doit être amélioré ?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Périmètre et éléments hors périmètre
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critères d'acceptation
      description: Utilisez des cases à cocher vérifiables.
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Stratégie de test
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: Documentation et impact opérationnel
    validations:
      required: true
