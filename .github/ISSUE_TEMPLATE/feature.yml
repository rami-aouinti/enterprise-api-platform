name: Feature
description: Propose a user-visible or architectural capability
title: "[FEATURE] "
labels: []
body:
  - type: textarea
    id: outcome
    attributes:
      label: Problem and expected outcome
      description: Who needs this and what should improve?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use verifiable checkboxes.
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Test strategy
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: Documentation and operational impact
    validations:
      required: true
