name: Signalement de bug
description: Signaler un défaut reproductible
title: "[BUG] "
labels: []
body:
  - type: textarea
    id: observed
    attributes:
      label: Comportement observé
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Étapes pour reproduire le problème
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environnement et journaux
      description: Supprimez les jetons, identifiants et données personnelles.
    validations:
      required: true
