openapi: 3.1.0
info:
  title: Enterprise API Platform — Customer Service
  version: 1.0.0
  description: Versioned REST API for customer lifecycle management.
servers:
  - url: /api/v1
    description: Current API version
tags:
  - name: Customers
    description: Customer resource operations
paths:
  /customers:
    get:
      tags: [Customers]
      operationId: listCustomers
      summary: List customers
      description: Returns a paginated customer collection.
      parameters:
        - name: page
          in: query
          description: One-based page number.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          description: Number of records per page (maximum 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Customer collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerCollection'
        '400':
          $ref: '#/components/responses/Problem'
    post:
      tags: [Customers]
      operationId: createCustomer
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
            example:
              first_name: Ada
              last_name: Lovelace
              email: ada.lovelace@example.org
              phone: '+44 20 7946 0958'
              status: active
      responses:
        '201':
          description: Customer created.
          headers:
            Location:
              description: URI of the created customer.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /customers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Customer UUID.
        schema:
          type: string
          format: uuid
    get:
      tags: [Customers]
      operationId: getCustomer
      summary: Get a customer
      responses:
        '200':
          description: Customer resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          $ref: '#/components/responses/Problem'
    patch:
      tags: [Customers]
      operationId: updateCustomer
      summary: Partially update a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerPatch'
            example:
              phone: '+49 30 123456'
              status: inactive
      responses:
        '200':
          description: Customer updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
components:
  schemas:
    Customer:
      type: object
      additionalProperties: false
      required: [id, first_name, last_name, email, phone, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: [string, 'null']
          maxLength: 30
        status:
          type: string
          enum: [active, inactive]
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    CustomerInput:
      type: object
      additionalProperties: false
      required: [first_name, last_name, email]
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: [string, 'null']
          maxLength: 30
        status:
          type: string
          enum: [active, inactive]
          default: active
    CustomerPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: [string, 'null']
          maxLength: 30
        status:
          type: string
          enum: [active, inactive]
    CustomerCollection:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        meta:
          type: object
          required: [page, per_page, total, total_pages]
          properties:
            page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
            total_pages:
              type: integer
    Problem:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: object
          additionalProperties:
            type: string
  responses:
    Problem:
      description: RFC 9457 Problem Details response.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.enterprise-platform.test/problems/validation-error
            title: Validation failed
            status: 422
            detail: One or more fields are invalid.
            instance: /api/v1/customers
            errors:
              email: A valid email address is required.
