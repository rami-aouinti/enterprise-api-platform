openapi: 3.1.0
info:
  title: Enterprise API Platform — Service Client
  version: 1.0.0
  description: API REST versionnée pour la gestion du cycle de vie des clients.
  contact:
    name: Enterprise API Platform Team
    url: https://github.com/rami-aouinti/enterprise-api-platform/issues
    email: api-platform@example.org
servers:
  - url: /api/v1
    description: Version actuelle de l'API
tags:
  - name: Customers
    description: Opérations sur les ressources clients
paths:
  /customers:
    get:
      tags: [Customers]
      operationId: listCustomers
      summary: Lister les clients
      description: Retourne une collection de clients paginée.
      security:
        - oauth2: [customers:read]
      parameters:
        - name: page
          in: query
          description: Numéro de page (à partir de 1).
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          description: Nombre d'enregistrements par page (maximum 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Collection de clients.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerCollection'
        '400':
          $ref: '#/components/responses/Problem'
    post:
      tags: [Customers]
      operationId: createCustomer
      summary: Créer un client
      description: Crée un client et retourne la ressource créée.
      security:
        - oauth2: [customers:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
            example:
              first_name: Ada
              last_name: Lovelace
              email: ada.lovelace@example.org
              phone: '+44 20 7946 0958'
              status: active
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Client créé.
          headers:
            Location:
              description: URI du client créé.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /customers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: UUID du client.
        schema:
          type: string
          format: uuid
    get:
      tags: [Customers]
      operationId: getCustomer
      summary: Récupérer un client
      description: Retourne les détails du client identifié par son UUID.
      security:
        - oauth2: [customers:read]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Ressource client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          $ref: '#/components/responses/Problem'
    patch:
      tags: [Customers]
      operationId: updateCustomer
      summary: Modifier partiellement un client
      description: Met à jour uniquement les champs fournis pour le client.
      security:
        - oauth2: [customers:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerPatch'
            example:
              phone: '+49 30 123456'
              status: inactive
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Client mis à jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: http://localhost:8081/realms/enterprise-platform/protocol/openid-connect/token
          scopes:
            customers:read: Lire les ressources client.
            customers:write: Créer et modifier les ressources client.
  schemas:
    Customer:
      type: object
      additionalProperties: false
      required: [id, first_name, last_name, email, phone, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: [string, 'null']
          maxLength: 30
        status:
          type: string
          enum: [active, inactive]
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    CustomerInput:
      type: object
      additionalProperties: false
      required: [first_name, last_name, email]
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: [string, 'null']
          maxLength: 30
        status:
          type: string
          enum: [active, inactive]
          default: active
    CustomerPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: [string, 'null']
          maxLength: 30
        status:
          type: string
          enum: [active, inactive]
    CustomerCollection:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        meta:
          type: object
          required: [page, per_page, total, total_pages]
          properties:
            page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
            total_pages:
              type: integer
    Problem:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: object
          additionalProperties:
            type: string
  responses:
    Unauthorized:
      description: Jeton Bearer absent, expiré ou invalide.
    Forbidden:
      description: Le jeton ne possède pas le scope OAuth2 requis.
    Problem:
      description: Réponse Problem Details conforme à la RFC 9457.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.enterprise-platform.test/problems/validation-error
            title: Échec de la validation
            status: 422
            detail: Un ou plusieurs champs ne sont pas valides.
            instance: /api/v1/customers
            errors:
              email: Une adresse e-mail valide est obligatoire.
