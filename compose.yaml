name: enterprise-api-platform
services:
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api/Dockerfile
    container_name: enterprise-api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_DEBUG: ${APP_DEBUG:-1}
      APP_SECRET: ${APP_SECRET:-local-dev-secret-change-before-deployment}
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-enterprise_api}
      DB_USER: ${POSTGRES_USER:-enterprise_api}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8081/realms/enterprise-platform}
      KEYCLOAK_DISCOVERY_BASE_URI: ${KEYCLOAK_DISCOVERY_BASE_URI:-http://keycloak:8080/realms/enterprise-platform/}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-enterprise-api}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      database:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks: [platform]
    healthcheck:
      test: ["CMD", "php", "-r", '$$r=@file_get_contents("http://127.0.0.1:8000/health/ready"); exit($$r === false ? 1 : 0);']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  database:
    image: postgres:17-alpine
    container_name: enterprise-api-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_api}
      POSTGRES_USER: ${POSTGRES_USER:-enterprise_api}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [platform]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-enterprise_api} -d ${POSTGRES_DB:-enterprise_api}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    container_name: enterprise-api-keycloak
    command: ["start-dev", "--import-realm"]
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Set KEYCLOAK_ADMIN_USERNAME in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KEYCLOAK_MACHINE_CLIENT_SECRET: ${KEYCLOAK_MACHINE_CLIENT_SECRET:?Set KEYCLOAK_MACHINE_CLIENT_SECRET in .env}
    ports: ["127.0.0.1:8081:8080", "127.0.0.1:9000:9000"]
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./infrastructure/keycloak/realm:/opt/keycloak/data/import:ro
    networks: [platform]

  kong:
    image: kong:3.9.1
    container_name: enterprise-api-gateway
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_STATUS_LISTEN: "0.0.0.0:8100"
      KONG_PLUGINS: bundled
      KONG_LOG_LEVEL: notice
    ports:
      - "127.0.0.1:8001:8000"
      - "127.0.0.1:8002:8001"
      - "127.0.0.1:8100:8100"
    volumes:
      - ./infrastructure/kong/kong.yml:/kong/declarative/kong.yml:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [platform]
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  platform:
    driver: bridge
volumes:
  postgres_data:
  keycloak_data:
