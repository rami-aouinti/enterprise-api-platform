services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Customer\Application\CustomerRepository:
        alias: App\Customer\Infrastructure\DoctrineCustomerRepository
        public: true

    App\ApiRegistry\Application\ApiRegistryRepository:
        alias: App\ApiRegistry\Infrastructure\DoctrineApiRegistryRepository
        public: true
