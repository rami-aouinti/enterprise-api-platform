security:
    providers:
        keycloak_users:
            id: App\Security\KeycloakUserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false

        main:
            pattern: ^/
            stateless: true
            provider: keycloak_users

    access_control:
        - { path: ^/health(?:/|$), roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/registry/apis/?$, methods: [GET], roles: SCOPE_APIS_READ }
        - { path: ^/api/v1/registry/apis/?$, methods: [POST], roles: SCOPE_APIS_WRITE }
        - { path: ^/api/v1/registry/apis/[^/]+/versions/[^/]+/?$, methods: [GET], roles: SCOPE_APIS_READ }
        - { path: ^/api/v1/registry/apis/[^/]+/versions/?$, methods: [POST], roles: SCOPE_APIS_WRITE }
        - { path: ^/api/v1/registry/apis/[^/]+/?$, methods: [GET], roles: SCOPE_APIS_READ }
        - { path: ^/api/v1/registry/apis/[^/]+/?$, methods: [PATCH], roles: SCOPE_APIS_WRITE }
        - { path: ^/api/v1/customers/?$, methods: [GET], roles: SCOPE_CUSTOMERS_READ }
        - { path: ^/api/v1/customers/?$, methods: [POST], roles: SCOPE_CUSTOMERS_WRITE }
        - { path: ^/api/v1/customers/[^/]+$, methods: [GET], roles: SCOPE_CUSTOMERS_READ }
        - { path: ^/api/v1/customers/[^/]+$, methods: [PATCH], roles: SCOPE_CUSTOMERS_WRITE }
