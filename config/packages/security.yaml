security:
    providers:
        keycloak_users:
            id: App\Security\KeycloakUserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false

        main:
            pattern: ^/
            stateless: true
            provider: keycloak_users
            access_token:
                token_handler:
                    oidc:
                        algorithms: ['RS256']
                        audience: '%env(KEYCLOAK_AUDIENCE)%'
                        issuers: ['%env(KEYCLOAK_ISSUER)%']
                        discovery:
                            base_uri: '%env(KEYCLOAK_DISCOVERY_BASE_URI)%'
                            cache:
                                id: cache.app

    access_control:
        - { path: ^/health(?:/|$), roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/customers/?$, methods: [GET], roles: ROLE_API_READ }
        - { path: ^/api/v1/customers/?$, methods: [POST], roles: ROLE_API_WRITE }
        - { path: ^/api/v1/customers/[^/]+$, methods: [GET], roles: ROLE_API_READ }
        - { path: ^/api/v1/customers/[^/]+$, methods: [PATCH], roles: ROLE_API_WRITE }
