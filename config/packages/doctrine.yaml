doctrine:
    dbal:
        driver: pdo_pgsql
        host: '%env(resolve:DB_HOST)%'
        port: '%env(int:DB_PORT)%'
        dbname: '%env(resolve:DB_NAME)%'
        user: '%env(resolve:DB_USER)%'
        password: '%env(DB_PASSWORD)%'
        server_version: '17'
        profiling_collect_backtrace: '%kernel.debug%'
